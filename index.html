<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PIXEL QUEST - 像素冒險</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="title">
      <h1>PIXEL QUEST</h1>
      <p class="sub">像素冒險 · 收集金幣、踩扁史萊姆、抵達終點旗幟</p>
    </header>

    <div class="screen">
      <canvas id="game" width="320" height="192"></canvas>
      <div class="scanlines"></div>
    </div>

    <section class="controls">
      <div class="keys">
        <span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> 移動</span>
        <span><kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 跳躍（長按跳更高）</span>
        <span><kbd>Enter</kbd> 開始 / 重來</span>
        <span><kbd>M</kbd> 靜音</span>
      </div>
      <div class="touch" id="touch">
        <div class="pad">
          <button data-key="left" aria-label="左">◀</button>
          <button data-key="right" aria-label="右">▶</button>
        </div>
        <div class="pad">
          <button data-key="jump" aria-label="跳躍">▲</button>
          <button data-key="start" aria-label="開始">●</button>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>踩到史萊姆頭上可以擊倒它 · 掉進洞裡或碰到尖刺會失去生命 · 剩餘時間會換算成獎勵分數</p>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
